name: Bug report
description: Report a bug or unexpected behavior
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve FasterTest. Please search existing issues first.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Clear description of what went wrong
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: e.g. 1.0.0 or git SHA
  - type: dropdown
    id: env
    attributes:
      label: Environment
      options:
        - Local (npm run ui)
        - Docker Compose
        - Linux VM / systemd
        - Other
  - type: dropdown
    id: storage
    attributes:
      label: Storage backend
      options:
        - MySQL
        - JSON (data/*.json)
        - Not sure
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste server logs (redact secrets, JWT, passwords)
      render: text
