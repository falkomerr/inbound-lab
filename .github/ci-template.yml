name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      STORAGE_BACKEND: json
      JWT_SECRET: ci-only-not-a-deployment-secret-at-least-32-characters
      APP_BASE_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Publication tests and source scan
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 scripts/publication.py check --tracked
          python3 scripts/publication.py export --output release/inbound-lab
      - name: Receiver tests
        run: python3 -m unittest discover -s deploy/target -p 'test_*.py'
      - name: Install locked dependencies
        working-directory: platform
        run: bun install --frozen-lockfile
      - name: Dependency audit
        working-directory: platform
        run: bun audit
      - name: Lint and test
        working-directory: platform
        run: |
          bun run lint
          bun run test
      - name: Build both interfaces
        working-directory: platform
        run: |
          bun run build:ui
          bunx vite build --config vite.vpn.config.js
