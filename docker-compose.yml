services:
  mysql:
    image: mysql:8.4
    container_name: load-test-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-loadtest}
      MYSQL_USER: ${MYSQL_USER:-loadtest}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-loadtest}
    ports:
      # Host 3307 — 3306 is often taken by another local MySQL container
      - '${MYSQL_HOST_PORT:-3307}:3306'
    volumes:
      - loadtest_mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-uroot', '-proot']
      interval: 5s
      timeout: 5s
      retries: 20

  # Optional full stack: docker compose --profile full up -d
  app:
    profiles: ['full']
    build: .
    container_name: load-test-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - '${UI_PORT:-3001}:3001'
    environment:
      NODE_ENV: production
      UI_PORT: 3001
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3001}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3001}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-loadtest}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-loadtest}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-loadtest}
      STORAGE_BACKEND: mysql
      ENV: ${ENV:-staging}
      BASE_URL: ${BASE_URL:-https://httpbin.org}
      TRUST_PROXY: ${TRUST_PROXY:-}
    volumes:
      - loadtest_reports:/app/reports
      - loadtest_logs:/app/logs
      - ./tests/scenarios:/app/tests/scenarios:ro

volumes:
  loadtest_mysql_data:
  loadtest_reports:
  loadtest_logs:
