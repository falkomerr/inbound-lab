services:
  mysql:
    image: mysql:8.4
    container_name: load-test-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-loadtest}
      MYSQL_USER: ${MYSQL_USER:-loadtest}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    ports:
      # Host 3307 — 3306 is often taken by another local MySQL container
      # Prefer binding to localhost only on shared hosts: 127.0.0.1:3307:3306
      - '${MYSQL_HOST_PORT:-3307}:3306'
    volumes:
      - loadtest_mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" || exit 1']
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt:
      - no-new-privileges:true

  # Optional full stack: docker compose --profile full up -d
  app:
    profiles: ['full']
    build:
      context: .
      args:
        K6_VERSION: ${K6_VERSION:-1.8.0}
        APP_VERSION: ${APP_VERSION:-1.0.0}
        VCS_REF: ${VCS_REF:-unknown}
    container_name: load-test-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - '${UI_PORT:-3001}:3001'
    environment:
      NODE_ENV: production
      UI_PORT: 3001
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3001}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3001}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-loadtest}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-loadtest}
      STORAGE_BACKEND: mysql
      ENV: ${ENV:-staging}
      BASE_URL: ${BASE_URL:-https://httpbin.org}
      TRUST_PROXY: ${TRUST_PROXY:-}
      K6_VERSION: ${K6_VERSION:-1.8.0}
    volumes:
      - loadtest_reports:/app/reports
      - loadtest_logs:/app/logs
      - loadtest_data:/app/data
      - ./tests/scenarios:/app/tests/scenarios:ro
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://127.0.0.1:3001/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
        reservations:
          cpus: '0.25'
          memory: 256M

volumes:
  loadtest_mysql_data:
  loadtest_reports:
  loadtest_logs:
  loadtest_data:
